# Monitoring settings per priority
priority_settings:
  high:
    fetch_interval_hours: 4
    alert_on_negative_spike: true
    negative_spike_threshold: 0.2  # 20% increase in negative reviews
  medium:
    fetch_interval_hours: 8
    alert_on_negative_spike: true
    negative_spike_threshold: 0.3
  low:
    fetch_interval_hours: 24
    alert_on_negative_spike: false
    negative_spike_threshold: 0.5

# App ID change tracking
# When apps renew, their package IDs may change
# Track previous IDs for data continuity
app_id_history:
  # Example entries (fictional). previous ids are merged into legacy_ids.
  - current: "com.example.bank_c"
    previous:
      - id: "com.example.bank_c.legacy"
        note: "구버전 패키지 (가상 예시)"

