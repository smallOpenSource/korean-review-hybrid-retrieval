# -----------------------------------------------------------------------------
# 다중 부서 협업 규칙
# -----------------------------------------------------------------------------
collaboration_rules:
  # 보안 + 피해 발생 시
  - trigger_keywords: ["해킹", "피해", "무단출금", "부정거래"]
    primary: "INFO_SECURITY.SECURITY_INCIDENT"
    secondary:
      - division: "RISK_MANAGEMENT"
        team: "INCIDENT_RESPONSE"
        role: "support"
      - division: "COMPLIANCE"
        team: "EXTERNAL_COMPLAINT"
        role: "review"

  # 카드 결제 + 오류
  - trigger_keywords: ["카드결제", "결제오류", "승인거절"]
    primary: "CARD_BUSINESS.CARD_SERVICE"
    secondary:
      - division: "IT_INFRA"
        team: "SYSTEM_OPERATION"
        role: "support"

  # 대출 + 금리/이자 민원
  - trigger_keywords: ["대출금리", "이자높음", "금리인하"]
    primary: "LOAN_BUSINESS.LOAN_MANAGEMENT"
    secondary:
      - division: "COMPLIANCE"
        team: "LEGAL_COMPLIANCE"
        role: "review"

  # 앱 오류 + 이체 실패
  - trigger_keywords: ["이체오류", "이체실패", "송금안됨"]
    primary: "DIGITAL_CHANNEL.MOBILE_BANKING"
    secondary:
      - division: "IT_INFRA"
        team: "SYSTEM_OPERATION"
        role: "support"

  # 법적 언급
  - trigger_keywords: ["금감원", "소송", "고소", "법적"]
    primary: "COMPLIANCE.EXTERNAL_COMPLAINT"
    secondary:
      - division: "CUSTOMER_SERVICE"
        team: "CALL_CENTER"
        role: "support"

  # 인증 + 앱 오류
  - trigger_keywords: ["로그인안됨", "인증오류", "OTP오류"]
    primary: "INFO_SECURITY.AUTH_SECURITY"
    secondary:
      - division: "IT_INFRA"
        team: "APP_PLATFORM"
        role: "support"

# -----------------------------------------------------------------------------
# 긴급도 기반 에스컬레이션 규칙
# -----------------------------------------------------------------------------
escalation_rules:
  # 금전 피해 시
  financial_damage:
    keywords: ["피해", "사기", "해킹", "무단출금", "돈잃었"]
    urgency: 4
    escalation_level: "dept_head"
    sla_hours: 4

  # 법적 이슈 언급
  legal_mention:
    keywords: ["금감원", "소송", "고소", "법적조치", "신고"]
    urgency: 4
    escalation_level: "executive"
    sla_hours: 4

  # 서비스 전면 장애
  service_outage:
    keywords: ["접속불가", "서비스중단", "전면장애", "서버다운"]
    urgency: 3
    escalation_level: "team_lead"
    sla_hours: 24

  # 반복 민원
  repeated_complaint:
    keywords: ["또", "계속", "몇번째", "여러번", "반복"]
    urgency: 3
    escalation_level: "team_lead"
    sla_hours: 24
