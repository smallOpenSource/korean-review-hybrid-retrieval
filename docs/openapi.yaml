openapi: 3.0.3
info:
  title: App Reviews Analysis API
  description: |
    Google Play Store 앱 리뷰 분석 시스템 API.
    Multi-Agent System을 활용한 감성 분석, 민원 분류, 유사 리뷰 검색을 제공합니다.
  version: 2.0.0
  contact:
    name: API Support
  license:
    name: MIT

servers:
  - url: http://localhost:5000/api/v1
    description: Development server
  - url: https://api.example.com/api/v1
    description: Production server

tags:
  - name: Reviews
    description: 리뷰 조회 및 검색
  - name: Analysis
    description: 분석 데이터 조회
  - name: Complaints
    description: 민원 관리

paths:
  /reviews:
    get:
      tags:
        - Reviews
      summary: 리뷰 목록 조회
      description: 필터링 및 페이지네이션을 지원하는 리뷰 목록 조회
      parameters:
        - name: app_id
          in: query
          schema:
            type: string
          description: 앱 ID 필터
        - name: sentiment
          in: query
          schema:
            type: string
            enum: [very_negative, negative, neutral, positive, very_positive]
          description: 감성 라벨 필터
        - name: is_complaint
          in: query
          schema:
            type: boolean
          description: 민원 여부 필터
        - name: date_from
          in: query
          schema:
            type: string
            format: date
          description: 시작 날짜 (ISO 8601)
        - name: date_to
          in: query
          schema:
            type: string
            format: date
          description: 종료 날짜 (ISO 8601)
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: 페이지 번호
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: 페이지 크기
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reviews/{review_id}:
    get:
      tags:
        - Reviews
      summary: 리뷰 상세 조회
      parameters:
        - name: review_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'
        '404':
          description: 리뷰를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reviews/{review_id}/similar:
    get:
      tags:
        - Reviews
      summary: 유사 리뷰 검색
      description: 특정 리뷰와 유사한 리뷰 검색 (벡터 유사도 기반)
      parameters:
        - name: review_id
          in: path
          required: true
          schema:
            type: string
        - name: k
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
          description: 반환할 유사 리뷰 수
        - name: include_trend
          in: query
          schema:
            type: boolean
            default: true
          description: 일별 트렌드 포함 여부
        - name: trend_days
          in: query
          schema:
            type: integer
            default: 30
          description: 트렌드 분석 일수
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarReviewResponse'

  /reviews/search/similar:
    post:
      tags:
        - Reviews
      summary: 내용 기반 유사 리뷰 검색
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  description: 검색할 리뷰 내용
                app_id:
                  type: string
                  description: 앱 ID 필터
                k:
                  type: integer
                  default: 10
                min_similarity:
                  type: number
                  default: 0.75
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarReviewResponse'

  /analysis/dashboard:
    get:
      tags:
        - Analysis
      summary: 대시보드 데이터 조회
      parameters:
        - name: app_id
          in: query
          schema:
            type: string
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'

  /analysis/company/{company_code}:
    get:
      tags:
        - Analysis
      summary: 회사별 분석 조회
      parameters:
        - name: company_code
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyAnalysisResponse'

  /analysis/trend:
    get:
      tags:
        - Analysis
      summary: 트렌드 분석 조회
      parameters:
        - name: app_id
          in: query
          schema:
            type: string
        - name: metric
          in: query
          schema:
            type: string
            enum: [sentiment, complaints, rating]
            default: sentiment
        - name: interval
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: day
        - name: days
          in: query
          schema:
            type: integer
            default: 90
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendResponse'

  /analysis/words:
    get:
      tags:
        - Analysis
      summary: 단어 빈도 분석
      parameters:
        - name: app_id
          in: query
          schema:
            type: string
        - name: sentiment_type
          in: query
          schema:
            type: string
            enum: [negative, positive, all]
            default: all
        - name: top_n
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WordAnalysisResponse'

  /analysis/words/{word}/trend:
    get:
      tags:
        - Analysis
      summary: 특정 단어 트렌드
      parameters:
        - name: word
          in: path
          required: true
          schema:
            type: string
        - name: app_id
          in: query
          schema:
            type: string
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WordTrendResponse'

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    Review:
      type: object
      properties:
        review_id:
          type: string
        app_id:
          type: string
        app_name:
          type: string
        original_content:
          type: string
        cleansed_content:
          type: string
        rating:
          type: integer
        review_date:
          type: string
          format: date-time
        sentiment:
          $ref: '#/components/schemas/Sentiment'
        category:
          $ref: '#/components/schemas/Category'
        complaint:
          $ref: '#/components/schemas/Complaint'

    Sentiment:
      type: object
      properties:
        label:
          type: string
          enum: [very_negative, negative, neutral, positive, very_positive]
        score:
          type: integer
          minimum: 1
          maximum: 5
        emotions:
          type: array
          items:
            type: string
        confidence:
          type: number

    Category:
      type: object
      properties:
        primary:
          type: string
        secondary:
          type: array
          items:
            type: string
        confidence:
          type: number

    Complaint:
      type: object
      properties:
        is_complaint:
          type: boolean
        type:
          type: string
        urgency:
          type: integer
          minimum: 1
          maximum: 4
        primary_dept:
          type: string
        escalation_required:
          type: boolean

    SimilarReview:
      type: object
      properties:
        review_id:
          type: string
        content:
          type: string
        similarity_score:
          type: number
        app_name:
          type: string
        rating:
          type: integer
        review_date:
          type: string
          format: date-time
        sentiment_label:
          type: string

    DailyCount:
      type: object
      properties:
        date:
          type: string
        count:
          type: integer

    WordFrequency:
      type: object
      properties:
        word:
          type: string
        count:
          type: integer
        rank:
          type: integer
        percentage:
          type: number

    ReviewListResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ReviewDetailResponse:
      type: object
      properties:
        status:
          type: string
        data:
          $ref: '#/components/schemas/Review'

    SimilarReviewResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            query_content:
              type: string
            similar_reviews:
              type: array
              items:
                $ref: '#/components/schemas/SimilarReview'
            daily_trend:
              type: array
              items:
                $ref: '#/components/schemas/DailyCount'
            total_similar_count:
              type: integer
            search_method:
              type: string
              enum: [vector, keyword]

    DashboardResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            period:
              type: object
            sentiment:
              type: object
            complaints:
              type: object
            duplicates:
              type: object
            top_negative_words:
              type: object

    CompanyAnalysisResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            company_code:
              type: string
            period:
              type: object
            sentiment:
              type: object
            complaints:
              type: object
            word_analysis:
              type: object

    TrendResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            metric:
              type: string
            interval:
              type: string
            period:
              type: object
            trend:
              type: array

    WordAnalysisResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            sentiment_type:
              type: string
            period:
              type: string
            total_reviews:
              type: integer
            total_words:
              type: integer
            top_words:
              type: array
              items:
                $ref: '#/components/schemas/WordFrequency'

    WordTrendResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            word:
              type: string
            days:
              type: integer
            trend:
              type: array
              items:
                $ref: '#/components/schemas/DailyCount'
